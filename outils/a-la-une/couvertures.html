<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../base.css">
<style>
  body { display: flex; flex-wrap: wrap; gap: 20px; background: #000; }
  .couv { position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: radial-gradient(85% 85% at 50% 38%, #1C2F57 0%, var(--navy) 52%, var(--navy-deep) 100%); }
  .couv .halo { left: 40px; top: 20px; }
  .couv svg { position: absolute; left: 50%; top: 50%; width: 440px; height: 440px; transform: translate(-50%, -50%);
    fill: none; stroke: url(#or); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 28px rgba(230,211,163,.28)); }
  .couv .anneau { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; transform: translate(-50%, -50%);
    border-radius: 50%; border: 2px solid rgba(201,169,96,.35); }

  /* Variante B : crème, icône bleu nuit */
  body.creme .couv { background: radial-gradient(90% 90% at 50% 35%, #FFFDF7 0%, var(--cream) 50%, var(--cream-2) 100%); }
  body.creme .couv svg { stroke: var(--navy); filter: none; }
  body.creme .couv .anneau { border-color: rgba(176,141,62,.45); }
  body.creme .couv .halo, body.creme .couv .vignette { display: none; }
  /* Variante C : or en feuille, icône bleu nuit */
  body.or .couv { background: linear-gradient(135deg, #9C7A30 0%, #E9D49A 30%, #C9A960 50%, #F6E8BE 70%, #B08D3E 100%); }
  body.or .couv svg { stroke: var(--navy); stroke-width: 1.3; filter: none; }
  body.or .couv .anneau, body.or .couv .halo, body.or .couv .vignette { display: none; }
  /* Variante D : bleu nuit, mot en Fraunces italique doré */
  body.mot .couv svg { display: none; }
  body.mot .couv::after { content: attr(data-mot); position: absolute; inset: 0; display: grid; place-items: center;
    font-family: "Fraunces"; font-style: italic; font-weight: 400; font-size: 150px; letter-spacing: -.01em;
    background: var(--or-feuille); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .couv svg .pt { fill: url(#or); stroke: none; }
  body.creme .couv svg .pt, body.or .couv svg .pt { fill: var(--navy); }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D49A"/><stop offset=".45" stop-color="#C9A960"/>
      <stop offset=".7" stop-color="#F6E8BE"/><stop offset="1" stop-color="#B08D3E"/>
    </linearGradient>
  </defs>
</svg>

<!-- 1. Le test -->
<section class="couv" data-mot="Test"><div class="halo"></div><div class="anneau"></div>
  <svg viewBox="0 0 24 24"><path d="M8.6 9a3.4 3.4 0 1 1 5.1 2.9c-1 .6-1.7 1.3-1.7 2.5v.9"/><circle class="pt" cx="12" cy="18.7" r=".85"/></svg>
  <div class="vignette"></div><div class="grain"></div></section>

<!-- 2. Comment -->
<section class="couv" data-mot="Comment"><div class="halo"></div><div class="anneau"></div>
  <svg viewBox="0 0 24 24"><rect x="3" y="7.2" width="18" height="12.6" rx="2.4"/><path d="M8.2 7.2 9.6 4.6h4.8l1.4 2.6"/><circle cx="12" cy="13.4" r="3.4"/></svg>
  <div class="vignette"></div><div class="grain"></div></section>

<!-- 3. Rappels -->
<section class="couv" data-mot="Rappels"><div class="halo"></div><div class="anneau"></div>
  <svg viewBox="0 0 24 24"><path d="M6.2 16.2V11a5.8 5.8 0 0 1 11.6 0v5.2l1.6 2H4.6z"/><path d="M10.1 20.6a2 2 0 0 0 3.8 0"/></svg>
  <div class="vignette"></div><div class="grain"></div></section>

<!-- 4. Formules -->
<section class="couv" data-mot="Formules"><div class="halo"></div><div class="anneau"></div>
  <svg viewBox="0 0 24 24"><path d="M3.6 11.6V4.4a.8.8 0 0 1 .8-.8h7.2l9 9-8 8z"/><circle cx="7.9" cy="7.9" r="1.4"/></svg>
  <div class="vignette"></div><div class="grain"></div></section>

<!-- 5. Sécurité -->
<section class="couv" data-mot="Sécurité"><div class="halo"></div><div class="anneau"></div>
  <svg viewBox="0 0 24 24"><rect x="5" y="10.6" width="14" height="10" rx="2.2"/><path d="M8.2 10.6V8a3.8 3.8 0 0 1 7.6 0v2.6"/><path d="M12 14.6v2.2"/></svg>
  <div class="vignette"></div><div class="grain"></div></section>

<!-- 6. À garder -->
<section class="couv" data-mot="À garder"><div class="halo"></div><div class="anneau"></div>
  <svg viewBox="0 0 24 24"><path d="M7 3.4h10a.6.6 0 0 1 .6.6v16.6L12 16.6l-5.6 4V4a.6.6 0 0 1 .6-.6z"/></svg>
  <div class="vignette"></div><div class="grain"></div></section>
</body></html>
