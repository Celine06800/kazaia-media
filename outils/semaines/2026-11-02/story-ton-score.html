<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../base.css">
<script src="../../base.js"></script>
<style>

  .zone { position: absolute; left: 140px; right: 140px; top: 1180px; height: 220px; border: 3px dashed rgba(201,169,96,.5); border-radius: 40px;

  .logo { position: absolute; left: 50%; transform: translateX(-50%); top: 1560px; width: 300px; }

<body>
<div class="reel">
  <div class="halo" style="left:40px; top:60px"></div>
  <canvas class="poussiere"></canvas>
  <div class="s">
    <div class="kicker">Ton score ?</div>
    <div class="t">Ta tête t'a écrit combien de messages <em>cette nuit&nbsp;?</em></div>

  <div class="vignette"></div><div class="grain"></div>
