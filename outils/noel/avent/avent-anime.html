<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../base.css"><style>
.reel{background:radial-gradient(110% 70% at 50% 35%,#1d3260 0%,var(--navy) 45%,var(--navy-deep) 100%)}
#monde{position:absolute;inset:0;transform-origin:0 0}
.kick{position:absolute;top:210px;left:0;right:0;text-align:center;font:600 30px Inter;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.titreCal{position:absolute;top:262px;left:0;right:0;text-align:center;font:italic 400 64px Fraunces;color:var(--cream)}
#grille{position:absolute;left:72px;top:400px;width:936px;display:grid;grid-template-columns:repeat(4,210px);gap:32px 32px}
.cel{position:relative;width:210px;height:178px;perspective:900px}
.fond{position:absolute;inset:0;border-radius:16px;background:radial-gradient(circle at 50% 40%,#2a4479,#0a1630 75%);box-shadow:inset 0 0 0 3px rgba(201,169,96,.55),inset 0 10px 30px rgba(0,0,0,.6);display:grid;place-items:center}
.fond .etoile{width:70px;height:70px;background:var(--or-feuille);clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);filter:drop-shadow(0 0 12px #E6C77C)}
.porte{position:absolute;inset:0;border-radius:16px;transform-origin:0 50%;backface-visibility:hidden;
background:linear-gradient(155deg,#F6E8BE 0%,#C9A960 38%,#9C7A30 72%,#E9D49A 100%);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 5px rgba(255,255,255,.18);display:grid;place-items:center}
.porte::before{content:"";position:absolute;inset:12px;border-radius:10px;border:2px solid rgba(15,30,58,.32)}
.porte span{font:italic 400 92px/1 Fraunces;color:var(--navy);position:relative}
.porte .poignee{position:absolute;right:16px;top:50%;width:12px;height:12px;border-radius:50%;background:#7d5a1e;transform:translateY(-50%)}
#halo{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(246,232,190,.45),rgba(201,169,96,.18) 45%,transparent 70%);pointer-events:none;opacity:0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,244,214,.95),rgba(230,199,124,.5) 40%,transparent 75%);opacity:0;pointer-events:none}
#contenu{position:absolute;inset:0;opacity:0}
.num{position:absolute;top:300px;left:0;right:0;text-align:center;font:italic 400 230px/1 Fraunces}
.c-kick{position:absolute;top:220px;left:0;right:0;text-align:center;font:600 28px Inter;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.t{position:absolute;top:640px;left:100px;right:100px;text-align:center;font:600 86px/1.08 Fraunces;color:var(--cream);letter-spacing:-.015em;text-wrap:balance}
.g{position:absolute;top:930px;left:110px;right:110px;text-align:center;font:400 46px/1.42 Inter;color:rgba(250,247,240,.88);text-wrap:balance}
.lien{position:absolute;top:1300px;left:0;right:0;text-align:center;font:600 36px Inter;color:var(--gold)}
.demain{position:absolute;top:1400px;left:0;right:0;text-align:center;font:italic 400 44px Fraunces;color:var(--gold-light)}
.logo{position:absolute;left:50%;transform:translateX(-50%);top:1560px;width:250px}
canvas{position:absolute;inset:0;pointer-events:none}
</style></head><body><div class="reel"><div id="monde"><div class="kick">Kazaia · décembre</div><div class="titreCal">Le calendrier de l'Avent des papiers</div><div id="grille"></div><div id="halo"></div></div>
<div id="flash"></div><div id="contenu"></div><canvas id="neige" width="1080" height="1920"></canvas><div class="vignette"></div><div class="grain"></div></div>
<script>
const CASES=[["Décembre commence. Tes papiers aussi ?", "Pose une boîte « à traiter » dans l'entrée : tout ce qui arrive ce mois-ci y entre, tu la vides le samedi."], ["Le cadeau est acheté. Et le ticket ?", "Photographie le ticket de caisse dès l'achat. C'est lui qui compte pour un échange ou une garantie."], ["Le ticket cadeau, tu y penses ?", "Demande-le en caisse et glisse-le dans le paquet : la personne pourra échanger sans te le dire."], ["Jusqu'à quand peut-on échanger ?", "Chaque magasin fixe sa date. Note-la dans ton agenda le jour de l'achat."], ["Vacances : tes papiers sont-ils à jour ?", "Regarde dès maintenant la date de validité des cartes d'identité et passeports de toute la famille."], ["Tu fais le test ?", "10 questions pour mesurer ta charge mentale administrative. Lien en bio."], ["Ski à l'étranger cet hiver ?", "Commande la carte européenne d'assurance maladie de chaque membre de la famille sur ton compte ameli, avant le départ."], ["Ton assurance couvre-t-elle le séjour ?", "Relis les garanties de ta carte bancaire et de ton contrat habitation avant de payer une assurance en plus."], ["Le carnet de santé part en vacances ?", "Glisse-le dans le sac des enfants, avec la carte Vitale. Tu n'auras pas à y repenser sur place."], ["Les achats en ligne, tu les retrouves ?", "Un dossier « Cadeaux 2026 » dans ta boîte mail : chaque confirmation de commande y va."], ["Un abonnement se renouvelle en janvier ?", "Fais la liste de ceux qui repartent au 1er janvier. Celui dont tu ne te sers plus, c'est maintenant qu'on l'arrête."], ["Tu fais le test ?", "Avant les fêtes, prends une minute : ton score de charge mentale. Lien en bio."], ["Qui va où, quand, pendant les fêtes ?", "Un seul agenda partagé pour la famille : repas, trajets, gardes. Tout le monde voit la même chose."], ["Qui t'a offert quoi ?", "Note-le au fil des paquets. Les remerciements de janvier deviennent faciles."], ["La garantie du nouvel appareil ?", "Range la facture et la notice ensemble, dans le même dossier. C'est la facture qui prouve la date d'achat."], ["Le livret de famille, tu sais où il est ?", "Un endroit, toujours le même, avec les actes importants. Et une copie dans un espace sécurisé."], ["Tes contrats changent au 1er janvier ?", "Repère les dates d'échéance de ta box, ton assurance et ton énergie. C'est souvent là que tu peux changer."], ["Sur la route des vacances ?", "Carte grise, attestation d'assurance et permis : vérifie qu'ils sont dans la voiture avant de partir."], ["Une copie de tes papiers sur toi ?", "Prends en photo tes pièces d'identité et range-les dans un espace protégé, pas dans ta galerie."], ["Tes soins de l'année sont remboursés ?", "Fais le point sur tes relevés de mutuelle et de l'Assurance maladie avant la fin de l'année."], ["Un don cette année ?", "Garde chaque reçu fiscal dans un dossier « Impôts 2027 ». Tu les retrouveras au printemps."], ["Avant de partir, tu fais le test ?", "Tes vacances, ta tête légère : ton score de charge mentale en 1 minute. Lien en bio."], ["Chez la famille pour Noël ?", "La liste des papiers à emporter : identité, carte Vitale, ordonnances en cours. Coche avant de fermer la valise."], ["Ce soir, ta tête se repose.", "Les papiers attendront. Joyeux réveillon, de toute l'équipe Kazaia ✦"]];
const N=+(location.hash.slice(1)||1);
const ORDRE=[7,19,3,14,22,1,11,16,9,24,5,18,13,2,20,8,17,10,23,4,12,21,6,15];
const g=document.getElementById('grille');const portes={};
ORDRE.forEach(n=>{const c=document.createElement('div');c.className='cel';c.innerHTML='<div class="fond"><div class="etoile"></div></div><div class="porte"><span>'+n+'</span><i class="poignee"></i></div>';g.appendChild(c);portes[n]=c.querySelector('.porte');
 if(n<N){portes[n].style.transform='rotateY(-112deg)';}});
const [titre,geste]=CASES[N-1];const test=/test/i.test(titre);
document.getElementById('contenu').innerHTML='<div class="c-kick">Le calendrier de l\'Avent des papiers</div><div class="num or">'+N+'</div><div class="t">'+titre+'</div><div class="g">'+geste+'</div>'+(test?'<div class="lien">Touche le lien ↓</div>':'')+(N<24?'<div class="demain">Demain, case '+(N+1)+' ✦</div>':'')+'<img class="logo" src="../../kazaia-logo.png">';
// position cible
const cel=portes[N].parentElement;let cx,cy;
function mesure(){const r=cel.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;const h=document.getElementById('halo');h.style.left=(cx-210)+'px';h.style.top=(cy-210)+'px';}
mesure();
// neige deterministe
const cv=document.getElementById('neige'),ctx=cv.getContext('2d');let s=N*977;const rnd=()=>((s=(s*16807)%2147483647)/2147483647);
const flocons=[...Array(110)].map(()=>({x:rnd()*1080,y:rnd()*1920,r:2+rnd()*5,v:30+rnd()*70,a:.25+rnd()*.6,o:rnd()*6}));
const E=x=>x<0?0:x>1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;const cl=x=>Math.max(0,Math.min(1,x));
window.render=function(t){
 // zoom 1.4s -> 3.6s
 const z=E((t-1.4)/2.2), S=1+z*3.4;
 const tx=540-cx*S, ty=980-cy*S;
 document.getElementById('monde').style.transform=`translate(${tx*z}px,${ty*z}px) scale(${S})`;
 // pulse halo avant zoom
 document.getElementById('halo').style.opacity=(0.3+0.25*Math.sin(t*5))*(1-cl((t-3.6)/0.4))+ (t>3.4? cl((t-3.6)/0.8)*0.9:0);
 // ouverture 3.8 -> 5.2
 const o=E((t-3.8)/1.4);portes[N].style.transform=`rotateY(${-112*o}deg)`;
 // flash 4.9 -> 5.9
 const f=t<5.3?cl((t-4.7)/0.6):1-cl((t-5.5)/0.8);document.getElementById('flash').style.opacity=f;
 const c=cl((t-5.3)/0.6);document.getElementById('contenu').style.opacity=c;document.getElementById('monde').style.opacity=1-c;
 const els=document.querySelectorAll('#contenu > *');els.forEach((e,i)=>{const k=E(cl((t-5.4-i*0.25)/0.6));e.style.opacity=k;e.style.translate=`0 ${(1-k)*30}px`});
 ctx.clearRect(0,0,1080,1920);for(const p of flocons){const y=(p.y+p.v*t)%1920,x=p.x+Math.sin(t+p.o)*18;ctx.globalAlpha=p.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,p.r,0,7);ctx.fill();}
};
window.render(0);
</script></body></html>
