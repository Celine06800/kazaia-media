<script>
(function(){
 const cv=document.querySelector('canvas.neige'),x=cv.getContext('2d');let s=1234567;const r=()=>((s=(s*16807)%2147483647)/2147483647);
 const fl=[...Array(150)].map(()=>({x:r()*1080,y:r()*1920,z:.35+r()*.65,o:r()*6,c:r()<.13}));
 const giv=[...document.querySelectorAll('.givre')];
 function flocon(px,py,R,a){x.save();x.translate(px,py);x.rotate(a);x.strokeStyle='#f3f8ff';x.lineWidth=Math.max(1.2,R/7);x.lineCap='round';
  for(let k=0;k<6;k++){x.rotate(Math.PI/3);x.beginPath();x.moveTo(0,0);x.lineTo(0,-R);x.moveTo(0,-R*.5);x.lineTo(-R*.25,-R*.72);x.moveTo(0,-R*.5);x.lineTo(R*.25,-R*.72);x.stroke();}
  x.restore();}
 const prev=window.render;
 window.render=function(t){ if(prev) prev(t); x.clearRect(0,0,1080,1920);
  for(const p of fl){const y=(p.y+t*(60+120*p.z))%2000-40, xx=p.x+Math.sin(t*.8+p.o)*30*p.z;
   x.globalAlpha=.35+.6*p.z;
   if(p.c){flocon(xx,y,10+16*p.z,t*.6+p.o);} else {const R=2+5*p.z;const gr=x.createRadialGradient(xx,y,0,xx,y,R*2.2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.beginPath();x.arc(xx,y,R*2.2,0,7);x.fill();}
   if(p.z>.92){const sc=(Math.sin(t*6+p.o)+1)/2;x.globalAlpha=sc*.9;x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.moveTo(xx-14*sc,y);x.lineTo(xx+14*sc,y);x.moveTo(xx,y-14*sc);x.lineTo(xx,y+14*sc);x.stroke();}
  }
  x.globalAlpha=1; giv.forEach((g,i)=>g.style.transform=`rotate(${t*(i%2?-4:5)}deg)`);
 };
})();
</script>
<script>
(function(){
 const cv=document.querySelector('canvas.eclat'),x=cv.getContext('2d');
 const cou=document.querySelector('.cadeau .couvercle');
 let s=42;const r=()=>((s=(s*16807)%2147483647)/2147483647);
 const eclats=[...Array(46)].map(()=>({a:r()*Math.PI*2,v:260+r()*420,R:4+r()*9,c:r()<.7?'#F1DFA6':(r()<.5?'#ffffff':'#E8504A'),o:r()*6}));
 // petits cadeaux qui tombent de temps en temps avec la neige
 const chute=[{t0:.2,x:170,c:'#C8323A',k:'#E6C878',s:62,rot:.5},{t0:2.6,x:930,c:'#1F6B4F',k:'#F1DFA6',s:54,rot:-.4},
              {t0:4.4,x:250,c:'#E6C878',k:'#C8323A',s:48,rot:.7},{t0:5.6,x:860,c:'#C8323A',k:'#F1DFA6',s:58,rot:-.6}];
 function petit(px,py,S,a,c,k){x.save();x.translate(px,py);x.rotate(a);x.globalAlpha=.92;x.fillStyle=c;x.fillRect(-S/2,-S/2,S,S);
  x.fillStyle=k;x.fillRect(-S*.09,-S/2,S*.18,S);x.fillRect(-S/2,-S*.09,S,S*.18);
  x.strokeStyle=k;x.lineWidth=S*.09;x.beginPath();x.ellipse(-S*.16,-S*.62,S*.17,S*.1,-.5,0,7);x.ellipse(S*.16,-S*.62,S*.17,S*.1,.5,0,7);x.stroke();x.restore();}
 const prev=window.render;
 window.render=function(t){ if(prev) prev(t); x.clearRect(0,0,1080,1920);
  for(const g of chute){const u=t-g.t0; if(u<0||u>5) continue; petit(g.x+Math.sin(u*1.3)*40,-80+u*430,g.s,g.rot*Math.sin(u*1.6),g.c,g.k);}
  // ouverture du couvercle à 2,4 s
  const u=Math.max(0,t-2.4), ouv=u<=0?0:Math.min(1,u/.35), ret=u>1.1?Math.min(1,(u-1.1)/.5):0;
  const h=ouv*(1-ret*.75), wob=u>0?Math.sin(u*14)*Math.exp(-u*3)*4:0;
  if(cou) cou.style.transform=`translateY(${-46*h}px) rotate(${-12*h+wob}deg)`;
  // gerbe d'étincelles dorées
  if(u>0&&u<2.2){const cx=510,cy=905;
   const lum=x.createRadialGradient(cx,cy,0,cx,cy,260);lum.addColorStop(0,`rgba(255,236,180,${.5*Math.exp(-u*1.6)})`);lum.addColorStop(1,'rgba(255,236,180,0)');
   x.globalAlpha=1;x.fillStyle=lum;x.beginPath();x.arc(cx,cy,260,0,7);x.fill();
   for(const e of eclats){const d=e.v*u*(1-u*.18),px=cx+Math.cos(e.a)*d,py=cy-Math.abs(Math.sin(e.a))*d*.9+Math.sin(e.a)*d*.1+160*u*u;
    x.globalAlpha=Math.max(0,1-u/2.2)*(.6+.4*Math.sin(t*12+e.o));x.fillStyle=e.c;x.save();x.translate(px,py);x.rotate(t*3+e.o);
    x.beginPath();for(let i=0;i<8;i++){const rr=i%2?e.R*.35:e.R;x.lineTo(Math.cos(i*Math.PI/4)*rr,Math.sin(i*Math.PI/4)*rr);}x.fill();x.restore();}
  }
  x.globalAlpha=1;
 };
})();
</script>
